<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Millplan Web</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Millplan Web">
<meta name="theme-color" content="#101d27">
<link rel="manifest" id="manifest-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c161e; --panel:#16283499; --panel2:#1c3140; --line:#6f9db3; --line-dim:#3c5a6b;
  --chalk:#eef8fb; --amber:#e8a35f; --amber-dim:#a97a48; --text:#f5f9fa; --text-dim:#b6cad3;
  --red:#ff7a5c; --green:#8fd39c; --radius:2px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:
  repeating-linear-gradient(0deg,transparent,transparent 27px,#ffffff05 28px),
  repeating-linear-gradient(90deg,transparent,transparent 27px,#ffffff05 28px),
  var(--bg);border-left:0.5px solid var(--line-dim);border-right:0.5px solid var(--line-dim);}
header{padding:20px 18px 14px;border-bottom:0.5px solid var(--line);}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
h1{font-family:'Big Shoulders',sans-serif;font-weight:700;font-size:32px;letter-spacing:.01em;margin:2px 0 0;text-transform:uppercase;}
.tabs{display:flex;border-bottom:0.5px solid var(--line);overflow-x:auto;}
.tab{flex:1;padding:12px 6px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);}
main{padding:18px;padding-bottom:60px;}
h2{font-family:'Big Shoulders',sans-serif;font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;}
.sub{color:var(--text-dim);font-size:13px;margin:0 0 18px;line-height:1.5;}
.panel{background:var(--panel);border:0.5px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
.row{display:flex;gap:10px;margin-bottom:10px;}
.row:last-child{margin-bottom:0;}
label{display:block;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;color:var(--text-dim);text-transform:uppercase;margin-bottom:5px;}
.field{flex:1;}
input[type=number],input[type=text]{width:100%;background:var(--panel2);border:0.5px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:15px;padding:9px 10px;border-radius:var(--radius);}
input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--amber);}
input[type=range]{width:100%;accent-color:var(--amber);}
.unit{color:var(--text-dim);font-size:12px;margin-left:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.seg{display:flex;border:0.5px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.seg button{flex:1;background:var(--panel2);color:var(--text-dim);border:none;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;cursor:pointer;text-transform:uppercase;}
.seg button.active{background:var(--amber);color:#1a1006;}
.checkrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--line-dim);}
.checkrow:last-child{border-bottom:none;}
.checkrow .name{font-family:'IBM Plex Mono',monospace;font-size:14px;}
.checkrow .dim{color:var(--text-dim);font-size:11px;margin-left:8px;}
.chk{width:18px;height:18px;border:0.5px solid var(--line);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--panel2);flex-shrink:0;}
.chk.on{background:var(--amber);border-color:var(--amber);}
.chk.on::after{content:'';width:9px;height:5px;border-left:2px solid #1a1006;border-bottom:2px solid #1a1006;transform:rotate(-45deg) translate(0,-1px);}
.pct{display:flex;align-items:center;gap:8px;}
.pct input{width:64px;text-align:right;}
.btn{background:var(--panel2);border:0.5px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;padding:10px 14px;border-radius:var(--radius);cursor:pointer;text-transform:uppercase;}
.btn:hover{border-color:var(--chalk);}
.btn.primary{background:var(--amber);color:#1a1006;border-color:var(--amber);font-weight:600;}
.btn.small{padding:6px 10px;font-size:11px;}
.btn.danger{color:var(--red);border-color:var(--red);}
.beamcard{border:0.5px solid var(--amber-dim);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:#d9915012;}
.beamcard .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.beamcard .hd .name{font-family:'IBM Plex Mono',monospace;color:var(--amber);font-size:12px;letter-spacing:.05em;text-transform:uppercase;}
.warn{color:var(--red);font-size:12px;font-family:'IBM Plex Mono',monospace;margin-top:6px;}
canvas{width:100%;display:block;background:var(--panel2);border:0.5px solid var(--line);border-radius:var(--radius);}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:var(--panel2);border-radius:var(--radius);padding:12px 14px;}
.stat .label{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;color:var(--text-dim);text-transform:uppercase;}
.stat .val{font-family:'Big Shoulders',sans-serif;font-size:30px;font-weight:700;color:var(--amber);line-height:1.1;margin-top:2px;}
table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:16px;}
table th{text-align:left;font-size:13px;letter-spacing:.06em;color:var(--text-dim);text-transform:uppercase;padding:0 0 8px;border-bottom:0.5px solid var(--line);}
table td{padding:8px 0;border-bottom:0.5px solid var(--line-dim);}
table td:last-child,table th:last-child{text-align:right;}
.footnote{font-size:11px;color:var(--text-dim);line-height:1.6;margin-top:14px;}
.rangebtn{display:flex;gap:8px;margin-bottom:16px;}
.rangebtn button{flex:1;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow" id="eyebrow">Sawmill planner — prototype v1</div>
    <h1>Millplan Web</h1>
  </header>
  <div class="tabs" id="tabs"></div>
  <main id="main"></main>
</div>
<script>
// ---------- state ----------
// ---------- version tracking ----------
// Bump APP_VERSION on any deploy. Bump SOFTWOOD_VERSION / HARDWOOD_VERSION only when
// that specific engine's logic changes, so you can tell at a glance which plan you're
// looking at came from which version of the math. Softwood is locked as of sw-3 —
// changes from here on should only touch hardwood unless you say otherwise.
const APP_VERSION = 'v13';
const SOFTWOOD_VERSION = 'sw-5';
const HARDWOOD_VERSION = 'hw-8';

// Rough starting $/board-foot estimates for softwood, seeded from general SPF/timber market
// ranges (framing lumber ~$0.7-1.1/bf, 1x appearance boards run a bit higher per bf, and
// squared timbers/beams command a premium). These are deliberately editable in Settings —
// real prices vary hugely by species, grade, and region, so treat these as a starting guess
// to be corrected to your own market before trusting Max Yield's $ ranking.
const state = {
  tab: 'settings',
  settings: {
    kerf: 0.082,
    dims: {
      '1x4': {w:3.625,h:0.75,value:1.60}, '1x6':{w:5.625,h:0.75,value:1.65}, '1x8':{w:7.625,h:0.75,value:1.70}, '1x10':{w:9.625,h:0.75,value:1.80},
      '2x4': {w:3.625,h:1.6,value:0.85},  '2x6':{w:5.625,h:1.6,value:0.90},  '2x8':{w:7.625,h:1.6,value:1.00},  '2x10':{w:9.625,h:1.6,value:1.15},
      '4x4': {w:3.625,h:3.625,value:1.30}, '6x6':{w:5.625,h:5.625,value:1.60}, '8x8':{w:7.625,h:7.625,value:2.00},
      '4/4':{h:1.0,value:3.00}, '5/4':{h:1.25,value:3.20}, '6/4':{h:1.5,value:3.40}, '8/4':{h:2.0,value:3.75}
    }
  },
  log: { largeDia:16, smallDia:12, length:120, bow:1, bowPeak:50, species:'softwood' },
  softwood: {
    selected: {'2x4':true,'2x6':true,'1x6':false,'1x8':false,'2x8':false,'2x10':false,'1x4':false,'1x10':false,'4x4':false,'6x6':false,'8x8':false},
    percents: {'2x4':40,'2x6':60},
    beams: [],
    kerfOverride: null
  },
  hardwood: {
    selected: {'4/4':true,'5/4':false,'6/4':false,'8/4':false},
    percents: {'4/4':100},
    desiredWidth: 6,
    kerfOverride: null
  },
  results: null,
  resultMode: 'max'
};

const SOFTWOOD_ORDER = ['1x4','1x6','1x8','1x10','2x4','2x6','2x8','2x10','4x4','6x6','8x8'];
const HARDWOOD_ORDER = ['4/4','5/4','6/4','8/4'];

// ---------- geometry / algorithm ----------
function taperDia(x,L,dL,dS){ return dL - (dL-dS)*(x/L); }
// Apex position of the bow along the length, as a fraction from the large end. Every entry
// point (planners, profile, layout, 3D view) sets this from state/results before geometry
// runs, so plans and views always use the same curve. Clamped away from the ends.
let BOW_PEAK_FRAC = 0.5;
function bowOffset(x,L,bow){
  if(!bow) return 0;
  const p = Math.min(0.9, Math.max(0.1, BOW_PEAK_FRAC)) * L;
  // piecewise parabola: zero at both ends, peak (= bow) at p with zero slope there, so the
  // curve stays smooth while the hump sits where it was actually measured on the log
  const t = x<=p ? (x-p)/p : (x-p)/(L-p);
  return bow*(1-t*t);
}
function sampleXs(L,n){ const xs=[]; for(let i=0;i<=n;i++) xs.push(L*i/n); return xs; }

function cantMaxWidth(c,H,xs,L,dL,dS,bow){
  let minVal = Infinity;
  for(const x of xs){
    const r = taperDia(x,L,dL,dS)/2;
    const y = bowOffset(x,L,bow);
    const e = Math.abs(c-y) + H/2;
    if(e >= r) return 0;
    const w = 2*Math.sqrt(r*r - e*e);
    if(w < minVal) minVal = w;
  }
  return minVal===Infinity?0:minVal;
}

function halfExtentAt(x,L,dL,dS,horizOffset){
  const r = taperDia(x,L,dL,dS)/2;
  const rem = r*r - horizOffset*horizOffset;
  return rem>0 ? Math.sqrt(rem) : 0;
}

const MIN_DIM = 0.0625; // 1/16" — anything at or below this is treated as "not a real board" to avoid divide-by-zero / infinite-row hangs

function priorityPack(W,H,orderNamesIn,dims,percents,kerf,useProportional){
  const safeKerf = Math.max(0, kerf||0);
  // Drop any degenerate (zero/blank) dimensions up front — this is the fix for the page-freeze
  // bug: a cleared input becoming 0 used to make placeRows loop effectively forever.
  const orderNames = orderNamesIn.filter(n=> dims[n] && dims[n].w>MIN_DIM && dims[n].h>MIN_DIM);

  let remH=H, yCursor=0;
  const counts={}; orderNamesIn.forEach(n=>counts[n]=0);
  const placements=[];

  function placeRows(name,rows){
    const bw=dims[name].w, bh=dims[name].h;
    const stepW = bw+safeKerf, stepH = bh+safeKerf;
    if(stepW<=1e-6 || stepH<=1e-6) return 0;
    const perRow = Math.floor((W+safeKerf)/stepW);
    if(perRow<=0 || rows<=0) return 0;
    for(let ri=0; ri<rows; ri++){
      for(let ci=0; ci<perRow; ci++){
        placements.push({name,x:ci*stepW, y:yCursor+ri*stepH, width:bw, height:bh, rotated: dims[name].rotated});
      }
    }
    counts[name]=(counts[name]||0)+rows*perRow;
    remH -= rows*stepH;
    yCursor += rows*stepH;
    return rows*perRow;
  }

  // Split selected types into "has a target %" vs "0% / unset" — the latter are treated as
  // gap-fillers that soak up whatever space is left after the percentage-driven types have
  // taken their proportional share, rather than competing for it.
  // If NOTHING has a target % (nobody set one), treat all selected types as equally weighted
  // rather than falling through to a first-come-first-served sweep — that was the "typed 0 for
  // everything and got 100% of one size" bug found in testing. If SOME are 0 and others aren't,
  // the 0% ones stay as leftover-fillers (see below).
  const anyPct = orderNames.some(n=> (percents[n]||0) > 0);
  const pctNames = anyPct ? orderNames.filter(n=> (percents[n]||0) > 0) : orderNames.slice();
  const zeroNames = anyPct ? orderNames.filter(n=> !(percents[n]>0)) : [];

  if(useProportional && pctNames.length){
    const totalP = pctNames.reduce((s,n)=>s+(percents[n]||0),0) || 1;
    const target = {}; pctNames.forEach(n=> target[n] = (percents[n]/totalP));
    const rowsSoFar = {}; pctNames.forEach(n=> rowsSoFar[n]=0);
    // Weighted round-robin / deficit scheduling: repeatedly hand ONE row to whichever eligible
    // type is furthest below its target share, so leftover space (from rounding) gets spread
    // across the mix instead of being dumped entirely into the first/highest-% type.
    let guard = 0;
    while(guard++ < 5000){
      let best=null, bestDeficit=-Infinity;
      for(const n of pctNames){
        const bw=dims[n].w, bh=dims[n].h;
        if(bw>W+1e-9) continue;
        if(remH+1e-9 < bh+safeKerf) continue;
        const totalPlaced = pctNames.reduce((s,m)=>s+rowsSoFar[m],0) + 1;
        const deficit = target[n] - (rowsSoFar[n]/Math.max(1,totalPlaced));
        if(deficit>bestDeficit){ bestDeficit=deficit; best=n; }
      }
      if(!best) break;
      const placed = placeRows(best,1);
      if(placed<=0) break;
      rowsSoFar[best] += 1;
    }
  }

  // Fill any remaining space with 0%-selected types first (gap fill for boards you still
  // want but didn't give a target ratio to), then keep sweeping the whole list until nothing
  // more fits (covers the useProportional:false / straight priority-fill case too).
  let progress=true, guard2=0;
  while(progress && guard2++<2000){
    progress=false;
    const sweepList = useProportional ? [...zeroNames, ...pctNames] : orderNames;
    for(const name of sweepList){
      const bh=dims[name].h, bw=dims[name].w;
      if(bw>W+1e-9) continue;
      const rows = Math.floor((remH+safeKerf)/(bh+safeKerf));
      if(rows>0){ placeRows(name,rows); progress=true; }
    }
  }
  return {counts, placements, remH, yCursor};
}

function bestOrientation(name, dims, W, H, kerf){
  const d = dims[name];
  const normalFits = d.w<=W+1e-9 && d.h<=H+1e-9;
  const rotFits = d.h<=W+1e-9 && d.w<=H+1e-9;
  if(normalFits) return {w:d.w,h:d.h,rotated:false};
  if(rotFits) return {w:d.h,h:d.w,rotated:true};
  return {w:d.w,h:d.h,rotated:false};
}

function effectiveDimsFor(names, dims, W, H, kerf){
  const eff = {};
  names.forEach(n=>{ eff[n] = bestOrientation(n,dims,W,H,kerf); });
  return eff;
}

function fallbackFill(W, remH, yCursorStart, namesIn, effDims, kerf){
  const safeKerf = Math.max(0, kerf||0);
  const names = namesIn.filter(n=> effDims[n] && effDims[n].w>MIN_DIM && effDims[n].h>MIN_DIM);
  let remaining = remH, yCursor = yCursorStart;
  const counts = {}; namesIn.forEach(n=>counts[n]=0);
  const placements = [];
  function placeRows(name, rows){
    const bw=effDims[name].w, bh=effDims[name].h;
    const stepW=bw+safeKerf, stepH=bh+safeKerf;
    if(stepW<=1e-6 || stepH<=1e-6) return;
    const perRow = Math.floor((W+safeKerf)/stepW);
    if(perRow<=0 || rows<=0) return;
    for(let ri=0; ri<rows; ri++){
      for(let ci=0; ci<perRow; ci++){
        placements.push({name,x:ci*stepW, y:yCursor+ri*stepH, width:bw, height:bh, rotated:effDims[name].rotated});
      }
    }
    counts[name]=(counts[name]||0)+rows*perRow;
    remaining -= rows*stepH;
    yCursor += rows*stepH;
  }
  let progress=true, guard=0;
  while(progress && guard++<2000){
    progress=false;
    for(const name of names){
      const bh=effDims[name].h, bw=effDims[name].w;
      if(bw>W+1e-9) continue;
      const rows = Math.floor((remaining+safeKerf)/(bh+safeKerf));
      if(rows>0){ placeRows(name,rows); progress=true; }
    }
  }
  return {counts, placements};
}

function packZone(W,H,orderNames,fallbackNames,dims,percents,kerf,useProportional){
  if(W<=0||H<=0) return {primaryCounts:{}, bonusCounts:{}, placements:[]};
  const effPrimary = effectiveDimsFor(orderNames,dims,W,H,kerf);
  const primary = priorityPack(W,H,orderNames,effPrimary,percents,kerf,useProportional);
  let bonus = {counts:{}, placements:[]};
  if(fallbackNames.length){
    const effFallback = effectiveDimsFor(fallbackNames,dims,W,H,kerf);
    bonus = fallbackFill(W, primary.remH, primary.yCursor, fallbackNames, effFallback, kerf);
  }
  const placements = [
    ...primary.placements.map(p=>({...p,bonus:false})),
    ...bonus.placements.map(p=>({...p,bonus:true}))
  ];
  return {primaryCounts:primary.counts, bonusCounts:bonus.counts, placements};
}

function buildOrder(selectedNames, mode, dims, percents){
  const arr = selectedNames.slice();
  if(mode==='value') arr.sort((a,b)=> (dims[b].value||0) - (dims[a].value||0) || dims[b].w-dims[a].w);
  else if(mode==='max') arr.sort((a,b)=> dims[b].w - dims[a].w);
  else arr.sort((a,b)=> (percents[b]||0) - (percents[a]||0));
  return arr;
}

function scoreValue(counts, dims, L){
  let s = 0;
  for(const [name,c] of Object.entries(counts)){
    if(!dims[name] || !c) continue;
    s += boardFeet(dims[name].w, dims[name].h, L, c) * (dims[name].value||0);
  }
  return s;
}

function boardCount(counts){ return Object.values(counts).reduce((a,b)=>a+b,0); }

function scoreArea(counts, dims){
  let s = 0;
  for(const [name,c] of Object.entries(counts)) s += (dims[name].w*dims[name].h)*c;
  return s;
}

function findBindingSlice(c,H,xs,L,dL,dS,bow){
  let minW=Infinity, best=null;
  for(const x of xs){
    const r = taperDia(x,L,dL,dS)/2;
    const y = bowOffset(x,L,bow);
    const e = Math.abs(c-y)+H/2;
    const w = e<r ? 2*Math.sqrt(r*r-e*e) : 0;
    if(w<minW){ minW=w; best={x,r,y,w}; }
  }
  return best;
}

function groupByWidth(names, dims){
  const map = {};
  names.forEach(n=>{
    const w = dims[n].w;
    if(!map[w]) map[w]=[];
    map[w].push(n);
  });
  return Object.entries(map).map(([w,ns])=>({width:parseFloat(w), names:ns})).sort((a,b)=>b.width-a.width);
}

function cantMaxHeightForWidth(c,W,xs,L,dL,dS,bow){
  let minVal=Infinity;
  for(const x of xs){
    const r=taperDia(x,L,dL,dS)/2;
    const y=bowOffset(x,L,bow);
    const rem=r*r-(W/2)*(W/2);
    if(rem<0) return 0;
    const avail=Math.sqrt(rem)-Math.abs(c-y);
    if(avail<minVal) minVal=avail;
  }
  return Math.max(0,2*minVal);
}

function findBestCantForWidth(W,xs,L,dL,dS,bow,cRange,step){
  let best=null;
  for(let c=-cRange; c<=cRange; c+=step){
    const H=cantMaxHeightForWidth(c,W,xs,L,dL,dS,bow);
    if(!best||H>best.H) best={c,H};
  }
  return best;
}

function totalPercentOf(g, percents){ return g.names.reduce((s,n)=>s+(percents[n]||0),0); }

// Searches width AND vertical offset together to find the single largest-area rectangle the
// log's envelope will allow, with no reference to the board catalog at all. Used whenever no
// selected board/beam combination fits, so the user gets a concrete "here's the biggest square
// or rectangle this log can give you" instead of a blank circle.
function maxInscribedRect(xs,L,dL,dS,bow){
  const maxW = Math.max(dL,dS,1);
  let best=null;
  for(let w=0.5; w<=maxW; w+=0.25){
    const cant = findBestCantForWidth(w, xs,L,dL,dS,bow, Math.max(bow*1.5,1), 0.25);
    if(!cant || cant.H<0.3) continue;
    const area = w*cant.H;
    if(!best || area>best.area) best = {W:w, H:cant.H, c:cant.c, area};
  }
  return best;
}

function chooseActiveGroups(mode, groups, dims, percents, xs, L, dL, dS, bow, kerf, cRangeBase){
  if(mode==='max'){
    // Max Yield is a $-value search, independent of the Your Mix percentages: every subset of
    // selected width-groups is tried (that combinatorial sweep is the "run several iterations
    // and compare" step), each packed with its highest-$/bf types getting first claim on the
    // available height, and the subset with the highest total dollar value wins — not just the
    // one with the most raw board feet. This is what lets a combination of many lower-priced
    // boards beat a smaller number of premium ones when the numbers actually work out that way.
    const n = groups.length;
    let best=null;
    for(let mask=1; mask<(1<<n); mask++){
      const subset = groups.filter((g,i)=> mask & (1<<i));
      const Wt = subset.reduce((s,g)=>s+g.width,0) + kerf*(subset.length-1);
      const cant = findBestCantForWidth(Wt, xs,L,dL,dS,bow, cRangeBase, 0.25);
      if(!cant || cant.H<2) continue;
      let value=0;
      subset.forEach(g=>{
        const packed = packZone(g.width, cant.H, buildOrder(g.names,'value',dims,percents), [], dims, percents, kerf, false);
        value += scoreValue(packed.primaryCounts, dims, L);
      });
      if(!best || value>best.value) best={groups:subset, cant, value};
    }
    return best ? {activeGroups:best.groups, cant:best.cant} : {activeGroups:[], cant:null};
  }
  let activeGroups = groups.slice();
  let cant=null, Wt=0;
  while(activeGroups.length){
    Wt = activeGroups.reduce((s,g)=>s+g.width,0) + kerf*(activeGroups.length-1);
    cant = findBestCantForWidth(Wt, xs,L,dL,dS,bow, cRangeBase, 0.25);
    if(cant && cant.H>=2) break;
    activeGroups.sort((a,b)=> totalPercentOf(a,percents)-totalPercentOf(b,percents));
    activeGroups.shift();
    cant=null;
  }
  return {activeGroups, cant};
}

function placeBeam(Wb,Hb,placement,xs,L,dL,dS,bow){
  let c;
  if(placement==='boxed'){ c=0; }
  else {
    const cLow = -(Hb/2)-0.05;
    const cHigh = bow+Hb/2+0.05;
    const wLow = cantMaxWidth(cLow,Hb,xs,L,dL,dS,bow);
    const wHigh = cantMaxWidth(cHigh,Hb,xs,L,dL,dS,bow);
    c = wLow>=wHigh ? cLow : cHigh;
  }
  const fitW = cantMaxWidth(c,Hb,xs,L,dL,dS,bow);
  if(fitW < Wb) return {fits:false,c};
  return {fits:true,c};
}

// ---- Live beam-fit helpers (Boards screen). Same geometry as placeBeam, so what the
// inline checker says always matches what the planner will conclude on the Results page.
function beamEnvelopeFor(beams,kerf){
  if(!beams.length) return null;
  if(beams.length===1) return {W:beams[0].w, H:beams[0].h};
  return {W:beams[0].w+beams[1].w+kerf, H:Math.max(beams[0].h,beams[1].h)};
}

function beamMaxWidthAt(H, placement, xs,L,dL,dS,bow){
  if(H<=0) return 0;
  if(placement==='boxed') return cantMaxWidth(0,H,xs,L,dL,dS,bow);
  const cLow=-(H/2)-0.05, cHigh=bow+H/2+0.05;
  return Math.max(cantMaxWidth(cLow,H,xs,L,dL,dS,bow), cantMaxWidth(cHigh,H,xs,L,dL,dS,bow));
}

// Largest H such that a beam wNeed wide still fits (max width shrinks as H grows, so a
// simple bisection converges). Rounded down to 1/4" so the suggestion always really fits.
function beamMaxHeightFor(wNeed, placement, xs,L,dL,dS,bow){
  let lo=0, hi=Math.max(dL,dS);
  for(let i=0;i<40;i++){
    const mid=(lo+hi)/2;
    if(beamMaxWidthAt(mid,placement,xs,L,dL,dS,bow) >= wNeed) lo=mid; else hi=mid;
  }
  return Math.floor(lo*4)/4;
}

function beamMaxSquare(placement, xs,L,dL,dS,bow){
  let lo=0, hi=Math.max(dL,dS);
  for(let i=0;i<40;i++){
    const mid=(lo+hi)/2;
    if(beamMaxWidthAt(mid,placement,xs,L,dL,dS,bow) >= mid) lo=mid; else hi=mid;
  }
  return Math.floor(lo*4)/4;
}

function boardFeet(w,h,L,count){ return (w*h*L*count)/144; }
function pieceValue(w,h,L,count,perBf){ return boardFeet(w,h,L,count) * (perBf||0); }

function logVolumeBF(dL,dS,L){
  const R1=dL/2, R2=dS/2;
  return (Math.PI*L/3)*(R1*R1+R1*R2+R2*R2)/144;
}

// ---- Softwood wing growth (sw-4): course-by-course, closest-to-center-first, using only
// preselected catalog widths — replaces the old independent-rectangle pocket search to match
// the user's real process of squaring off the next board in each direction and stepping down
// in size as the log narrows, instead of pre-solving one big secondary "cant" per side.
function growthCandidates(names, dims, percents, mode){
  return names.filter(n=>dims[n] && dims[n].w>MIN_DIM && dims[n].h>MIN_DIM)
    .map(n=>({name:n, w:dims[n].w, h:dims[n].h, value:dims[n].value||0, pct:percents[n]||0}))
    .sort((a,b)=>{
      if(Math.abs(a.w-b.w)>1e-6) return b.w-a.w; // widest board that still fits, first
      if(mode==='max') return (b.value-a.value);
      return (b.pct-a.pct);
    });
}

function growVerticalCourses(direction, startY, xs,L,dL,dS,bow, candidates, kerf){
  let cursor = startY;
  const placed = [];
  let guard=0;
  while(candidates.length && guard++<400){
    let chosen=null, chosenAvailW=0;
    for(const c of candidates){
      const bandCenter = cursor + direction*c.h/2;
      const availW = cantMaxWidth(bandCenter, c.h, xs,L,dL,dS,bow);
      if(availW >= c.w-1e-9){ chosen=c; chosenAvailW=availW; break; }
    }
    if(!chosen) break;
    const stepW = chosen.w+kerf;
    const perRow = Math.max(1, Math.floor((chosenAvailW+kerf)/stepW));
    const rowY = direction>0 ? cursor : cursor - chosen.h;
    for(let i=0;i<perRow;i++){
      placed.push({name:chosen.name, width:chosen.w, height:chosen.h, cxIn:-chosenAvailW/2+chosen.w/2+i*stepW, cyIn:rowY+chosen.h/2, rotated:false});
    }
    cursor = direction>0 ? cursor+chosen.h+kerf : cursor-chosen.h-kerf;
  }
  return {placed, endCursor:cursor};
}

function growHorizontalCourses(direction, startX, cantC, xs,L,dL,dS,bow, candidates, kerf){
  let cursor = startX;
  const placed = [];
  let guard=0;
  while(candidates.length && guard++<400){
    let chosen=null, chosenAvailH=0;
    for(const c of candidates){
      const outerX = cursor + direction*c.h;
      const availH = cantMaxHeightForWidth(cantC, 2*Math.abs(outerX), xs,L,dL,dS,bow);
      if(availH >= c.w-1e-9){ chosen=c; chosenAvailH=availH; break; }
    }
    if(!chosen) break;
    const stepH = chosen.w+kerf;
    const perCol = Math.max(1, Math.floor((chosenAvailH+kerf)/stepH));
    const colX = direction>0 ? cursor : cursor-chosen.h;
    for(let i=0;i<perCol;i++){
      placed.push({name:chosen.name, width:chosen.h, height:chosen.w, cxIn:colX+chosen.h/2, cyIn:cantC-chosenAvailH/2+chosen.w/2+i*stepH, rotated:true});
    }
    cursor = cursor + direction*(chosen.h+kerf);
  }
  return {placed, endCursor:cursor};
}

function growAllWings(Wb,Hb,c, primary, fallbackCands, kerf, xs,L,dL,dS,bow){
  const results = { top:[], bottom:[], left:[], right:[] };
  const gT = growVerticalCourses(1, c+Hb/2+kerf, xs,L,dL,dS,bow, primary, kerf);
  gT.placed.forEach(p=>results.top.push({...p,bonus:false}));
  growVerticalCourses(1, gT.endCursor, xs,L,dL,dS,bow, fallbackCands, kerf).placed.forEach(p=>results.top.push({...p,bonus:true}));

  const gB = growVerticalCourses(-1, c-Hb/2-kerf, xs,L,dL,dS,bow, primary, kerf);
  gB.placed.forEach(p=>results.bottom.push({...p,bonus:false}));
  growVerticalCourses(-1, gB.endCursor, xs,L,dL,dS,bow, fallbackCands, kerf).placed.forEach(p=>results.bottom.push({...p,bonus:true}));

  const gR = growHorizontalCourses(1, Wb/2+kerf, c, xs,L,dL,dS,bow, primary, kerf);
  gR.placed.forEach(p=>results.right.push({...p,bonus:false}));
  growHorizontalCourses(1, gR.endCursor, c, xs,L,dL,dS,bow, fallbackCands, kerf).placed.forEach(p=>results.right.push({...p,bonus:true}));

  const gL = growHorizontalCourses(-1, -(Wb/2+kerf), c, xs,L,dL,dS,bow, primary, kerf);
  gL.placed.forEach(p=>results.left.push({...p,bonus:false}));
  growHorizontalCourses(-1, gL.endCursor, c, xs,L,dL,dS,bow, fallbackCands, kerf).placed.forEach(p=>results.left.push({...p,bonus:true}));

  return results;
}

function wingSideSummary(list){
  if(!list.length) return null;
  const minX = Math.min(...list.map(p=>p.cxIn-p.width/2)), maxX = Math.max(...list.map(p=>p.cxIn+p.width/2));
  const minY = Math.min(...list.map(p=>p.cyIn-p.height/2)), maxY = Math.max(...list.map(p=>p.cyIn+p.height/2));
  return {w:maxX-minX, h:maxY-minY, count:list.length};
}

function runSoftwood(mode){
  const dL = Math.max(state.log.largeDia||0, 0.5), dS = Math.max(state.log.smallDia||0, 0.5), L = Math.max(state.log.length||0, 1), bow = state.log.bow||0;
  const bowPeak = state.log.bowPeak ?? 50;
  BOW_PEAK_FRAC = bowPeak/100;
  const xs = sampleXs(L,26);
  const kerf = Math.max(0, (state.softwood.kerfOverride ?? state.settings.kerf) || 0);
  const dims = state.settings.dims;
  const selectedNames = SOFTWOOD_ORDER.filter(n=>state.softwood.selected[n]);
  const percents = state.softwood.percents;
  const fallbackNames = SOFTWOOD_ORDER.filter(n=>!state.softwood.selected[n])
    .sort((a,b)=> dims[a].h-dims[b].h || dims[a].w-dims[b].w);
  const packOrderMode = mode==='max' ? 'value' : 'mix';
  const primaryCandidates = growthCandidates(selectedNames, dims, percents, packOrderMode);
  const fallbackCandidates = fallbackNames.filter(n=>dims[n]&&dims[n].w>MIN_DIM&&dims[n].h>MIN_DIM)
    .map(n=>({name:n,w:dims[n].w,h:dims[n].h}));

  let beamResults = [];
  let usedBeamEnvelope = null;
  const beams = state.softwood.beams;
  if(beams.length===1){
    const b = beams[0];
    const r = placeBeam(b.w,b.h,b.placement,xs,L,dL,dS,bow);
    beamResults.push({...b, ...r});
    if(r.fits) usedBeamEnvelope = {Wb:b.w,Hb:b.h,c:r.c};
  } else if(beams.length===2){
    const H = Math.max(beams[0].h, beams[1].h);
    const Wtot = beams[0].w + beams[1].w + kerf;
    const placement = beams[0].placement;
    const r = placeBeam(Wtot,H,placement,xs,L,dL,dS,bow);
    beams.forEach(b=>beamResults.push({...b, fits:r.fits, c:r.c}));
    if(r.fits) usedBeamEnvelope = {Wb:Wtot,Hb:H,c:r.c};
  }

  let wingResults = { top:[], bottom:[], left:[], right:[] };
  let mainCant = null;
  let segments = [];
  let envelope = null;
  let noFitRect = null;
  const anyBeamInfeasible = beamResults.some(b=>!b.fits);

  if(usedBeamEnvelope && !anyBeamInfeasible){
    const {Wb,Hb,c} = usedBeamEnvelope;
    wingResults = growAllWings(Wb,Hb,c, primaryCandidates, fallbackCandidates, kerf, xs,L,dL,dS,bow);
    const slice = findBindingSlice(c,Hb,xs,L,dL,dS,bow);
    envelope = {r:slice.r, y:slice.y, x:slice.x};
  } else if(!beams.length && selectedNames.length){
    const groups = groupByWidth(selectedNames,dims);
    const {activeGroups, cant} = chooseActiveGroups(mode, groups, dims, percents, xs,L,dL,dS,bow,kerf, Math.max(bow*1.5,1));
    if(cant){
      const Wt = activeGroups.reduce((s,g)=>s+g.width,0) + kerf*(activeGroups.length-1);
      let xCursor = -Wt/2;
      const rawSegments = activeGroups.map(g=>{
        const packed = packZone(g.width, cant.H, buildOrder(g.names,packOrderMode,dims,percents), [], dims, percents, kerf, mode!=='max');
        const seg = {width:g.width, names:g.names, cxIn:xCursor+g.width/2, packed};
        xCursor += g.width + kerf;
        return seg;
      });

      // shrink the cant to the actual used height (tallest segment) before evaluating wings,
      // so leftover material inside the theoretical cant becomes available to the wing growth
      const usedHeights = rawSegments.map(seg=>
        seg.packed.placements.reduce((m,p)=>Math.max(m, p.y+p.height), 0)
      );
      let actualH = Math.max(0, ...usedHeights);
      if(actualH<=0 || actualH>cant.H) actualH = cant.H;
      const topEdge = cant.c + cant.H/2;
      const actualC = topEdge - actualH/2;

      mainCant = {W:Wt, H:actualH, c:actualC};
      segments = rawSegments.map(seg=>({...seg, cyIn:actualC}));
      wingResults = growAllWings(Wt, actualH, actualC, primaryCandidates, fallbackCandidates, kerf, xs,L,dL,dS,bow);
      const slice = findBindingSlice(actualC, actualH, xs,L,dL,dS,bow);
      envelope = {r:slice.r, y:slice.y, x:slice.x};
    }
  }

  // Nothing fit (no beam placed, or no selected width-combo produced a usable cant): surface
  // the geometric maximum rectangle so the user has a concrete target for what to try next,
  // instead of a bare circle.
  if(!envelope && (beams.length || selectedNames.length)){
    const best = maxInscribedRect(xs,L,dL,dS,bow);
    if(best){
      noFitRect = best;
      const slice = findBindingSlice(best.c, best.H, xs,L,dL,dS,bow);
      envelope = {r:slice.r, y:slice.y, x:slice.x};
    }
  }

  const totalCounts = {};
  const bonusCounts = {};
  SOFTWOOD_ORDER.forEach(n=>{ totalCounts[n]=0; bonusCounts[n]=0; });
  ['top','bottom','left','right'].forEach(side=>{
    (wingResults[side]||[]).forEach(p=>{
      if(p.bonus) bonusCounts[p.name]=(bonusCounts[p.name]||0)+1;
      else totalCounts[p.name]=(totalCounts[p.name]||0)+1;
    });
  });
  segments.forEach(seg=>{
    Object.entries(seg.packed.primaryCounts).forEach(([k,v])=>totalCounts[k]=(totalCounts[k]||0)+v);
    Object.entries(seg.packed.bonusCounts).forEach(([k,v])=>bonusCounts[k]=(bonusCounts[k]||0)+v);
  });

  let totalBF = 0, bonusBF = 0;
  let totalArea = 0, totalValue = 0;
  SOFTWOOD_ORDER.forEach(n=>{
    totalBF += boardFeet(dims[n].w, dims[n].h, L, totalCounts[n]);
    bonusBF += boardFeet(dims[n].w, dims[n].h, L, bonusCounts[n]);
    totalArea += dims[n].w * dims[n].h * (totalCounts[n] + bonusCounts[n]);
    totalValue += pieceValue(dims[n].w, dims[n].h, L, totalCounts[n]+bonusCounts[n], dims[n].value);
  });
  const beamBF = beamResults.filter(b=>b.fits).reduce((s,b)=>s+boardFeet(b.w,b.h,L,1),0);
  beamResults.filter(b=>b.fits).forEach(b=>{ totalArea += b.w*b.h; totalValue += pieceValue(b.w,b.h,L,1,b.value ?? 1.20); });
  const logVolume = logVolumeBF(dL,dS,L);
  const yieldPct = logVolume>0 ? Math.round(100*(totalBF+bonusBF+beamBF)/logVolume) : 0;
  const smallEndArea = Math.PI*Math.pow(dS/2,2);
  const areaUtilPct = smallEndArea>0 ? Math.round(100*totalArea/smallEndArea) : 0;

  return {
    species:'softwood', mode, selectedNames, totalCounts, bonusCounts, totalBF: Math.round(totalBF), bonusBF: Math.round(bonusBF),
    beamResults, beamBF: Math.round(beamBF), mainCant, segments, wingResults, yieldPct: Math.min(yieldPct,100),
    areaUtilPct: Math.min(areaUtilPct,100),
    kerf, dL, dS, L, bow, bowPeak, beamEnvelope: usedBeamEnvelope, envelope, noFitRect,
    fits: !!(usedBeamEnvelope && !anyBeamInfeasible) || !!mainCant,
    totalValue: Math.round(totalValue)
  };
}

function verticalPocketHeight(innerY,direction,subW,xs,L,dL,dS,bow){
  let minVal=Infinity;
  for(const x of xs){
    const r=taperDia(x,L,dL,dS)/2;
    const y=bowOffset(x,L,bow);
    const rem = r*r-(subW/2)*(subW/2);
    if(rem<=0) return 0;
    const halfExtent=Math.sqrt(rem);
    const avail = direction>0 ? (y+halfExtent-innerY) : (innerY-(y-halfExtent));
    if(avail<minVal) minVal=avail;
  }
  return Math.max(0,minVal===Infinity?0:minVal);
}

function runHardwood(){
  const dL = Math.max(state.log.largeDia||0, 0.5), dS = Math.max(state.log.smallDia||0, 0.5), L = Math.max(state.log.length||0, 1), bow = state.log.bow||0;
  const bowPeak = state.log.bowPeak ?? 50;
  BOW_PEAK_FRAC = bowPeak/100;
  const xs = sampleXs(L,26);
  const kerf = Math.max(0, (state.hardwood.kerfOverride ?? state.settings.kerf) || 0);
  const dims = state.settings.dims;
  const selectedNames = HARDWOOD_ORDER.filter(n=>state.hardwood.selected[n]);
  const fallbackNames = HARDWOOD_ORDER.filter(n=>!state.hardwood.selected[n]);
  const percents = state.hardwood.percents;
  const W = state.hardwood.desiredWidth;

  function withNoFitRect(base){
    const best = maxInscribedRect(xs,L,dL,dS,bow);
    if(!best) return base;
    const slice = findBindingSlice(best.c, best.H, xs,L,dL,dS,bow);
    return {...base, noFitRect:best, envelope:{r:slice.r, y:slice.y, x:slice.x}};
  }

  const empty = {species:'hardwood', fits:false, W, cantH:0, cantC:0, totalCounts:{}, bonusCounts:{},
    totalBF:0, bonusBF:0, yieldPct:0, areaUtilPct:0, placements:[], dL,dS,L,bow,bowPeak,kerf, totalValue:0};
  if(!selectedNames.length || !(W>0)) return withNoFitRect(empty);

  const theoCant = findBestCantForWidth(W, xs, L, dL, dS, bow, Math.max(bow*1.5,1), 0.25);
  if(!theoCant || theoCant.H<0.5) return withNoFitRect({...empty, fits:false});

  const orderNames = buildOrder(selectedNames, 'mix', dims, percents);
  const dimsForPacking = {};
  [...orderNames, ...fallbackNames].forEach(n=>{ dimsForPacking[n] = {w:W, h:dims[n].h}; });

  const primary = priorityPack(W, theoCant.H, orderNames, dimsForPacking, percents, kerf, true);
  let bonus = {counts:{}, placements:[]};
  if(fallbackNames.length){
    bonus = fallbackFill(W, primary.remH, primary.yCursor, fallbackNames, dimsForPacking, kerf);
  }
  const placements = [
    ...primary.placements.map(p=>({...p,bonus:false})),
    ...bonus.placements.map(p=>({...p,bonus:true}))
  ];

  // shrink the cant to the actual used height before evaluating anything downstream —
  // same fix as softwood: leftover inside the theoretical cant becomes available to
  // the south pocket and the milling-preference passes instead of being trapped.
  const usedHeight = placements.reduce((m,p)=>Math.max(m, p.y+p.height), 0);
  let actualH = usedHeight>0 && usedHeight<=theoCant.H ? usedHeight : theoCant.H;
  const topEdge = theoCant.c + theoCant.H/2;
  const actualC = topEdge - actualH/2;
  const cant = {H:actualH, c:actualC};

  const totalCounts = {}, bonusCounts = {};
  HARDWOOD_ORDER.forEach(n=>{ totalCounts[n]=primary.counts[n]||0; bonusCounts[n]=bonus.counts[n]||0; });

  // South pocket: search for the best (narrower) width below the shrunk cant, same
  // thickness-mix logic as the main cant, since width is free here rather than catalog-fixed.
  let southPocket = null;
  const southInnerY = cant.c - cant.H/2 - kerf;
  let southBest = null;
  for(let subW=2; subW<=W; subW+=0.25){
    const h = verticalPocketHeight(southInnerY, -1, subW, xs, L, dL, dS, bow);
    if(h<0.3) continue;
    const dimsForSouth = {};
    [...orderNames, ...fallbackNames].forEach(n=>{ dimsForSouth[n] = {w:subW, h:dims[n].h}; });
    const sp = priorityPack(subW, h, orderNames, dimsForSouth, percents, kerf, true);
    let sb = {counts:{}, placements:[]};
    if(fallbackNames.length) sb = fallbackFill(subW, sp.remH, sp.yCursor, fallbackNames, dimsForSouth, kerf);
    const score = scoreArea(sp.counts,dimsForSouth) + scoreArea(sb.counts,dimsForSouth);
    if(!southBest || score>southBest.score) southBest = {subW, h, primary:sp, bonus:sb, score};
  }
  if(southBest){
    southPocket = {W:southBest.subW, H:southBest.h, cxIn:0, cyIn:southInnerY-southBest.h/2,
      primaryCounts:southBest.primary.counts, bonusCounts:southBest.bonus.counts,
      placements:[
        ...southBest.primary.placements.map(p=>({...p,bonus:false})),
        ...southBest.bonus.placements.map(p=>({...p,bonus:true}))
      ]};
  }

  let totalBF=0, bonusBF=0, totalArea=0, totalValue=0;
  HARDWOOD_ORDER.forEach(n=>{
    totalBF += boardFeet(W, dims[n].h, L, primary.counts[n]||0);
    bonusBF += boardFeet(W, dims[n].h, L, bonus.counts[n]||0);
    totalArea += W*dims[n].h*((primary.counts[n]||0)+(bonus.counts[n]||0));
    totalValue += pieceValue(W, dims[n].h, L, (primary.counts[n]||0)+(bonus.counts[n]||0), dims[n].value);
    if(southPocket){
      const spW = southPocket.W;
      totalBF += boardFeet(spW, dims[n].h, L, southPocket.primaryCounts[n]||0);
      bonusBF += boardFeet(spW, dims[n].h, L, southPocket.bonusCounts[n]||0);
      totalArea += spW*dims[n].h*((southPocket.primaryCounts[n]||0)+(southPocket.bonusCounts[n]||0));
      totalValue += pieceValue(spW, dims[n].h, L, (southPocket.primaryCounts[n]||0)+(southPocket.bonusCounts[n]||0), dims[n].value);
    }
  });

  const logVolume = logVolumeBF(dL,dS,L);
  const smallEndArea = Math.PI*Math.pow(dS/2,2);

  const slice = findBindingSlice(cant.c, cant.H, xs, L, dL, dS, bow);
  const envelope = {r:slice.r, y:slice.y, x:slice.x};

  // Milling preference: after squaring to your desired width, open the top with two passes,
  // then rotate CCW to take the east wing, then 180deg more for the west wing — each pass
  // trimmed to its own true maximum, not a fixed size.
  const customBoards = [];
  const T = orderNames.length ? dims[orderNames[0]].h : 0;
  if(T>0){
    let vCursor = cant.c + cant.H/2 + kerf;
    for(let i=0; i<2; i++){
      const vCenter = vCursor + T/2;
      const width = cantMaxWidth(vCenter, T, xs, L, dL, dS, bow);
      if(width < 2) break;
      customBoards.push({side:'top', width, t:T, cxIn:0, cyIn:vCenter});
      vCursor += T + kerf;
    }
    const numSide = Math.max(0, Math.floor((cant.H+kerf)/(T+kerf)));
    let xCursor = W/2 + kerf;
    for(let i=0; i<numSide; i++){
      const xOuter = xCursor + T;
      const height = cantMaxHeightForWidth(cant.c, 2*xOuter, xs, L, dL, dS, bow);
      if(height>=2){
        customBoards.push({side:'east', width:height, t:T, cxIn:xCursor+T/2, cyIn:cant.c});
        customBoards.push({side:'west', width:height, t:T, cxIn:-(xCursor+T/2), cyIn:cant.c});
      }
      xCursor += T + kerf;
    }
  }
  const customBF = customBoards.reduce((s,b)=>s+boardFeet(b.width,b.t,L,1),0);
  const refValue = orderNames.length ? (dims[orderNames[0]].value||0) : 0;
  const customValue = customBoards.reduce((s,b)=>s+pieceValue(b.width,b.t,L,1,refValue),0);
  totalValue += customValue;
  customBoards.forEach(b=>{ totalArea += b.width*b.t; });
  const areaUtilPct2 = smallEndArea>0 ? Math.round(100*totalArea/smallEndArea) : 0;
  const yieldPct2 = logVolume>0 ? Math.round(100*(totalBF+bonusBF+customBF)/logVolume) : 0;

  return {species:'hardwood', fits:true, W, cantH:cant.H, cantC:cant.c,
    totalCounts, bonusCounts, totalBF:Math.round(totalBF), bonusBF:Math.round(bonusBF),
    customBoards, customBF:Math.round(customBF), southPocket,
    yieldPct:Math.min(yieldPct2,100), areaUtilPct:Math.min(areaUtilPct2,100),
    placements, dL,dS,L,bow,bowPeak,kerf, envelope, totalValue: Math.round(totalValue)};
}

function runResults(){
  const mode = state.resultMode;

// ---------- Settings screen ----------
function storageAvailable(){
  try{
    const k = '__millplan_test__';
    localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}

function saveSettings(){
  try{ localStorage.setItem('millplan-settings', JSON.stringify(state.settings)); }catch(e){}
}

function loadSettings(){
  try{
    const raw = localStorage.getItem('millplan-settings');
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed.kerf==='number') state.settings.kerf = parsed.kerf;
    if(parsed && parsed.dims){
      Object.keys(parsed.dims).forEach(k=>{
        if(state.settings.dims[k]) state.settings.dims[k] = {...state.settings.dims[k], ...parsed.dims[k]};
      });
    }
  }catch(e){}
}

// defaults.

  try{ localStorage.setItem('millplan-log', JSON.stringify(state.log)); }catch(e){}

function drawProfile(canvas){
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const {largeDia:dL, smallDia:dS, length:L, bow} = state.log;
  BOW_PEAK_FRAC = (state.log.bowPeak ?? 50)/100;
  const pad=70;
  const scaleX = (W-2*pad)/L;
  const maxDia = Math.max(dL,dS,1);
  const scaleY = (H-2*pad-40)/maxDia;
  const midY = H/2;

  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line');
  ctx.lineWidth=2;
  const nTop=[], nBot=[];
  const N=60;
  for(let i=0;i<=N;i++){
    const x = L*i/N;
    const r = taperDia(x,L,dL,dS)/2;
    const y = bowOffset(x,L,bow);
    const px = pad + x*scaleX;
    nTop.push([px, midY-(y+r)*scaleY]);
    nBot.push([px, midY-(y-r)*scaleY]);
  }
  ctx.beginPath();
  nTop.forEach(([x,y],i)=> i===0? ctx.moveTo(x,y):ctx.lineTo(x,y));
  for(let i=nBot.length-1;i>=0;i--) ctx.lineTo(nBot[i][0],nBot[i][1]);
  ctx.closePath();
  ctx.fillStyle = '#d9915055';
  ctx.fill();
  ctx.strokeStyle = '#e8a35f';
  ctx.lineWidth=2.5;
  ctx.stroke();

  // pith centerline
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--chalk');
  ctx.setLineDash([4,4]);
  ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const x=L*i/N; const y=bowOffset(x,L,bow);
    const px=pad+x*scaleX, py=midY-y*scaleY;
    i===0? ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  function lbl(text,x,y){
    ctx.lineWidth=3; ctx.strokeStyle='#0a1319'; ctx.strokeText(text,x,y);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text');
    ctx.fillText(text,x,y);
  }
  ctx.font='bold 13px IBM Plex Mono';
  ctx.textAlign='center';
  lbl(`length ${fmt(L,0)} in`, W/2, H-24);
  ctx.textAlign='left';
  lbl(`${fmt(dL,1)}" `, pad-4, midY-(dL/2)*scaleY-8);
  lbl(`${fmt(dS,1)}" `, W-pad-4, midY-bowOffset(L,L,bow)*scaleY-(dS/2)*scaleY-8);
  const peakX = L*Math.min(0.9, Math.max(0.1, BOW_PEAK_FRAC));
  // apex marker on the pith centerline
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chalk');
  ctx.beginPath(); ctx.arc(pad+peakX*scaleX, midY-bowOffset(peakX,L,bow)*scaleY, 3.5, 0, Math.PI*2); ctx.fill();
  lbl(`bow ${fmt(bow,2)}"`, pad+peakX*scaleX, midY-bowOffset(peakX,L,bow)*scaleY-12);
}

function renderSpecies(){
  return state.log.species==='softwood' ? renderSoftwoodOptions() : renderHardwoodOptions();
}

function renderSoftwoodOptions(){
  const sw = state.softwood;
  const wrap = el(`<div>
    <h2>Softwood mix</h2>
    <p class="sub">Pick sizes, set a target mix, add beams if needed. Dimensions come from Settings.</p>
    <div class="panel"><label>Board sizes and mix (%)</label><div id="sw-list"></div>
      <p class="footnote" style="margin-top:8px;">% only balances sizes that share the exact same actual width (e.g. 1x6 and 2x6, both 5.625" — that's a resaw-thickness choice within one cant segment). Different widths (e.g. 2x4 vs 2x6) each get their own segment of the cant instead, sized by the combination search — percent doesn't move material between them. Leaving % at 0 for a size you've checked just fills it evenly alongside the others sharing its width, using whatever's left after any sizes with a set %.</p>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <label style="margin:0;">Beams (max 2)</label>
        <button class="btn small" id="add-beam" ${sw.beams.length>=2?'disabled':''}>+ Add beam</button>
      </div>
      <div id="beam-list"></div>
      <p class="footnote" id="beam-max-hint" style="margin-top:8px;"></p>
      <p class="footnote" style="margin-top:8px;">Boxed heart centers the beam on the pith and maximizes surrounding board yield. Free of heart center offsets the beam so the pith falls outside it — more stable, smaller yield from the remaining wood. Fit is checked live against the current log — no need to visit Results to find out.</p>
    </div>
    <div class="panel">
      <label>Kerf override for this log</label>
      <div class="row"><div class="field"><input type="number" step="0.0625" id="kerf-ov" value="${sw.kerfOverride ?? state.settings.kerf}"></div></div>
    </div>
  </div>`);

  const list = wrap.querySelector('#sw-list');
  SOFTWOOD_ORDER.forEach(n=>{
    const d = state.settings.dims[n];
    const row = el(`<div class="checkrow">
      <div style="display:flex;align-items:center;">
        <div class="chk ${sw.selected[n]?'on':''}"></div>
        <span class="name" style="margin-left:10px;">${n}</span>
        <span class="dim">${fmt(d.h,3)}"x${fmt(d.w,3)}"</span>
      </div>
      <div class="pct"><input type="number" min="0" max="100" value="${sw.percents[n]||0}"><span class="unit">%</span></div>
    </div>`);
    const chk = row.querySelector('.chk');
    const pctIn = row.querySelector('input');
    chk.onclick=()=>{ sw.selected[n]=!sw.selected[n]; if(!sw.selected[n]) sw.percents[n]=0; renderAll(); };
    pctIn.oninput=e=>{ sw.percents[n]=parseFloat(e.target.value)||0; };
    list.appendChild(row);
  });

  // Shared geometry context for the live beam-fit checks — clamped exactly like runSoftwood
  function beamGeomCtx(){
    BOW_PEAK_FRAC = (state.log.bowPeak ?? 50)/100;
    const dL=Math.max(state.log.largeDia||0,0.5), dS=Math.max(state.log.smallDia||0,0.5);
    const L=Math.max(state.log.length||0,1), bow=state.log.bow||0;
    return {dL,dS,L,bow, xs:sampleXs(L,26), kerf:Math.max(0,(sw.kerfOverride ?? state.settings.kerf)||0)};
  }

  const beamCards = [];
  function updateBeamUI(){
    const g = beamGeomCtx();
    const hint = wrap.querySelector('#beam-max-hint');
    if(hint) hint.textContent = `This log: largest square beam ≈ ${fmt(beamMaxSquare('boxed',g.xs,g.L,g.dL,g.dS,g.bow),2)}" boxed heart, ${fmt(beamMaxSquare('fohc',g.xs,g.L,g.dL,g.dS,g.bow),2)}" free of heart center.`;
    if(!sw.beams.length) return;
    const placement = sw.beams[0].placement;
    const env = beamEnvelopeFor(sw.beams, g.kerf);
    const availTotal = beamMaxWidthAt(env.H, placement, g.xs,g.L,g.dL,g.dS,g.bow);
    const fits = availTotal >= env.W - 1e-9;
    beamCards.forEach(({card,b,i})=>{
      const stat = card.querySelector('[data-stat]');
      if(!stat) return;
      const others = sw.beams.filter((x,j)=>j!==i);
      const othersW = others.reduce((s,o)=>s+o.w,0) + (others.length? g.kerf:0);
      const maxWForThis = availTotal - othersW;
      if(fits){
        stat.style.color='var(--green)';
        stat.textContent = `✓ fits this log — max width at this height ${fmt(Math.max(0,maxWForThis),2)}"`;
      } else if(maxWForThis >= 0.5){
        stat.style.color='var(--red)';
        stat.textContent = `✗ doesn't fit — max width at this height ${fmt(maxWForThis,2)}" (or tap fit to log)`;
      } else {
        stat.style.color='var(--red)';
        const needW = othersW + Math.min(b.w,1);
        stat.textContent = `✗ too tall — max height here ≈ ${fmt(beamMaxHeightFor(needW, placement, g.xs,g.L,g.dL,g.dS,g.bow),2)}" (or tap fit to log)`;
      }
    });
  }

  const beamList = wrap.querySelector('#beam-list');
  sw.beams.forEach((b,i)=>{
    const card = el(`<div class="beamcard">
      <div class="hd"><span class="name">Beam ${i+1}</span>
        <span style="display:flex;gap:8px;">
          <button class="btn small" data-fit>fit to log</button>
          <button class="btn small danger">remove</button>
        </span></div>
      <div class="grid2 row">
        <div class="field"><label>Width</label><input type="number" step="0.0625" value="${b.w}"></div>
        <div class="field"><label>Height</label><input type="number" step="0.0625" value="${b.h}"></div>
      </div>
      <div class="row"><div class="field"><label>Value</label><input type="number" step="0.05" value="${b.value ?? 1.20}"><span class="unit">$/bf</span></div></div>
      <div class="seg">
        <button class="${b.placement==='boxed'?'active':''}" data-p="boxed">Boxed heart</button>
        <button class="${b.placement==='fohc'?'active':''}" data-p="fohc">Free of heart center</button>
      </div>
      <div class="warn" data-stat style="margin-top:8px;"></div>
    </div>`);
    card.querySelector('.btn.danger').onclick=()=>{ sw.beams.splice(i,1); renderAll(); };
    const [wIn,hIn,valIn] = card.querySelectorAll('input');
    wIn.oninput=e=>{ b.w=parseFloat(e.target.value)||0; updateBeamUI(); };
    hIn.oninput=e=>{ b.h=parseFloat(e.target.value)||0; updateBeamUI(); };
    valIn.oninput=e=>b.value=parseFloat(e.target.value)||0;
    card.querySelectorAll('[data-p]').forEach(btn=>btn.onclick=()=>{ b.placement=btn.dataset.p; renderAll(); });
    card.querySelector('[data-fit]').onclick=()=>{
      const g = beamGeomCtx();
      const placement = sw.beams[0].placement;
      const others = sw.beams.filter((x,j)=>j!==i);
      const othersW = others.reduce((s,o)=>s+o.w,0) + (others.length? g.kerf:0);
      // keep the height, shrink the width to the most this log allows (rounded down to
      // 1/4"); if even a sliver won't fit at this height, drop the height to the max first
      const envH = Math.max(b.h, ...others.map(o=>o.h), 0);
      let maxW = beamMaxWidthAt(envH, placement, g.xs,g.L,g.dL,g.dS,g.bow) - othersW;
      if(maxW < 0.5){
        b.h = beamMaxHeightFor(othersW + Math.min(b.w,1), placement, g.xs,g.L,g.dL,g.dS,g.bow);
        hIn.value = b.h;
        const envH2 = Math.max(b.h, ...others.map(o=>o.h), 0);
        maxW = beamMaxWidthAt(envH2, placement, g.xs,g.L,g.dL,g.dS,g.bow) - othersW;
      }
      if(maxW >= 0.25){ b.w = Math.floor(maxW*4)/4; wIn.value = b.w; }
      updateBeamUI();
    };
    beamCards.push({card, b, i});
    beamList.appendChild(card);
  });

  wrap.querySelector('#add-beam').onclick=()=>{
    if(sw.beams.length<2){ sw.beams.push({w:8,h:4,placement:'boxed',value:1.20}); renderAll(); }
  };
  wrap.querySelector('#kerf-ov').oninput=e=>{ sw.kerfOverride = e.target.value===''? null : (parseFloat(e.target.value)||0); updateBeamUI(); };
  updateBeamUI();

  return wrap;
}

    const pctIn = row.querySelector('input');
    chk.onclick=()=>{ hw.selected[n]=!hw.selected[n]; if(!hw.selected[n]) hw.percents[n]=0; renderAll(); };
    pctIn.oninput=e=>{ hw.percents[n]=parseFloat(e.target.value)||0; };
    list.appendChild(row);
  });
  wrap.querySelector('#kerf-ov').oninput=e=>{ hw.kerfOverride = e.target.value===''? null : (parseFloat(e.target.value)||0); };

  return wrap;
}

const PALETTE = ['#d99150','#7fb88a','#8fb8c9','#e2664a','#c9a94f','#a084c4','#6bb1b8','#d97fa0','#9fcf6b','#e0b04f','#6f9bd9'];
function paletteColor(name, order){ const idx = order.indexOf(name); return PALETTE[(idx>=0?idx:0) % PALETTE.length]; }

// The three reference sections, color- and dash-matched between the board-layout view and the
// 3D mill view: solid blue = tightest (binding) section, dashed green = small end, dotted
// pink = large end. Deliberately distinct from the amber N / teal E orientation stripes.
const RING_STYLE = {
  tight: {color:'#6f9db3', dash:[]},
  small: {color:'#8fd39c', dash:[7,5]},
  large: {color:'#d97fa0', dash:[2,6]}
};

// Orientation stripe colors — vivid hues used nowhere else in the app (not in the board
// palette, ring styles, or theme), so N/E can never be confused with a board or a section ring.
const DIR_N_COLOR = '#ffd94a'; // N face — yellow
const DIR_E_COLOR = '#40d6ff'; // E face — cyan

function drawCrossSection(canvas, r){
  const ctx = canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  BOW_PEAK_FRAC = (r.bowPeak ?? 50)/100;
  const cx=W/2, cy=H/2;
  const env = r.envelope || {r:r.dS/2, y:0};
  const dia = env.r*2;
  const lineCol = getComputedStyle(document.documentElement).getPropertyValue('--line');
  const dimCol = getComputedStyle(document.documentElement).getPropertyValue('--line-dim');
  const textDimCol = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
  // scale to the largest circle drawn (the large end) so both end outlines fit around the plan
  const maxCircleR = Math.max(r.dL, r.dS, dia)/2;
  const scale = Math.min(W,H)*0.42 / maxCircleR;
  const R = env.r*scale;
  const RL = (r.dL/2)*scale, RS = (r.dS/2)*scale;

  // roll: quarter-turn rotation of the log (and everything cut into it) about its axis,
  // viewed from the small end. Screen-up is always "up on the mill" — rolling moves the
  // log's faces and the plan around together, like turning the log with a cant hook.
  const rollQ = ((millView.rollQ||0)%4+4)%4;
  const swapWH = rollQ%2===1;
  function rollPt(a,b){
    if(rollQ===1) return [-b,a];
    if(rollQ===2) return [-a,-b];
    if(rollQ===3) return [b,-a];
    return [a,b];
  }
  const [envA,envB] = rollPt(0, env.y);
  const circleCx = cx + envA*scale, circleCy = cy - envB*scale;

  // both log ends for reference — bow is zero at the ends, so both sit centered on the pith axis
  ctx.lineWidth=1.5;
  ctx.strokeStyle = RING_STYLE.large.color;
  ctx.setLineDash(RING_STYLE.large.dash);
  ctx.beginPath(); ctx.arc(cx,cy,RL,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = RING_STYLE.small.color;
  ctx.setLineDash(RING_STYLE.small.dash);
  ctx.beginPath(); ctx.arc(cx,cy,RS,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // binding (tightest) slice — the section the plan is actually packed against
  ctx.strokeStyle = RING_STYLE.tight.color;
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(circleCx,circleCy,R,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = dimCol;
  ctx.setLineDash([3,4]);
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(circleCx-R-10,circleCy); ctx.lineTo(circleCx+R+10,circleCy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(circleCx,circleCy-R-10); ctx.lineTo(circleCx,circleCy+R+10); ctx.stroke();
  ctx.setLineDash([]);

  function labelWithOutline(label, x, y, size){
    ctx.font=`bold ${size}px IBM Plex Mono`; ctx.textAlign='center';
    ctx.lineWidth=3.5; ctx.strokeStyle='#0a1319'; ctx.strokeText(label,x,y);
    ctx.fillText(label,x,y);
  }

  function rect(wIn,hIn,cxIn,cyIn,color,label,labelColor){
    const [ra,rb]=rollPt(cxIn,cyIn);
    const w=(swapWH?hIn:wIn)*scale, h=(swapWH?wIn:hIn)*scale;
    const x=cx+ra*scale-w/2, y=cy-rb*scale-h/2;
    ctx.fillStyle=color+'99'; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.strokeRect(x,y,w,h);
    if(label && w>60 && h>26){
      ctx.fillStyle=labelColor || getComputedStyle(document.documentElement).getPropertyValue('--text');
      labelWithOutline(label, x+w/2, y+h/2+7, 20);
    }
  }

  function rectAt(w,h,x,y,color,name,rotated,bonus){
    ctx.fillStyle=color+'99'; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=color; ctx.lineWidth=2;
    if(bonus) ctx.setLineDash([3,3]); else ctx.setLineDash([]);
    ctx.strokeRect(x,y,w,h);
    ctx.setLineDash([]);
    if(w>50 && h>24){
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text');
      const lbl = rotated ? name+'\u21bb' : name;
      labelWithOutline(lbl, x+w/2, y+h/2+6, 18);
    }
  }

  function rectPlacement(p,color){
    const [ra,rb]=rollPt(p._cx,p._cy);
    const w=(swapWH?p.height:p.width)*scale, h=(swapWH?p.width:p.height)*scale;
    const x=cx+ra*scale-w/2, y=cy-rb*scale-h/2;
    rectAt(w,h,x,y,color,p.name,p.rotated,p.bonus);
  }

  // Absolute-coordinate placement (used for the softwood wing growth courses, which aren't
  // confined to one pre-sized pocket rectangle the way the old zone model was).
  function rectAbs(p,color){
    const [ra,rb]=rollPt(p.cxIn,p.cyIn);
    const w=(swapWH?p.height:p.width)*scale, h=(swapWH?p.width:p.height)*scale;
    const x=cx+ra*scale-w/2, y=cy-rb*scale-h/2;
    rectAt(w,h,x,y,color,p.name,p.rotated,p.bonus);
  }

  function dashedOutline(zoneCxIn, zoneCyIn, zoneW, zoneH){
    if(zoneW<=0||zoneH<=0) return;
    const [ra,rb]=rollPt(zoneCxIn,zoneCyIn);
    const w=(swapWH?zoneH:zoneW)*scale, h=(swapWH?zoneW:zoneH)*scale;
    const x=cx+ra*scale-w/2, y=cy-rb*scale-h/2;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--chalk');
    ctx.setLineDash([6,5]); ctx.lineWidth=1.75;
    ctx.strokeRect(x,y,w,h);
    ctx.setLineDash([]);
  }

  function drawZone(zoneCxIn, zoneCyIn, zoneW, zoneH, placements, order){
    dashedOutline(zoneCxIn, zoneCyIn, zoneW, zoneH);
    const zoneLeft = zoneCxIn - zoneW/2;
    const zoneTop = zoneCyIn + zoneH/2;
    placements.forEach(p=>{
      p._cx = zoneLeft + p.x + p.width/2;
      p._cy = zoneTop - p.y - p.height/2;
      rectPlacement(p, paletteColor(p.name, order));
    });
  }

  if(r.species==='softwood'){
    const fittingBeams = r.beamResults.filter(b=>b.fits);
    if(fittingBeams.length===2){
      const kerf = r.kerf;
      const totalW = fittingBeams[0].w + fittingBeams[1].w + kerf;
      let runningX = -totalW/2;
      fittingBeams.forEach(b=>{
        const cxPos = runningX + b.w/2;
        rect(b.w,b.h,cxPos,b.c,'#d99150',`${fmt(b.w,2)}x${fmt(b.h,2)}`,'#1a1006');
        runningX += b.w + kerf;
      });
    } else {
      fittingBeams.forEach(b=>{
        rect(b.w,b.h,0,b.c,'#d99150',`${fmt(b.w,2)}x${fmt(b.h,2)}`,'#1a1006');
      });
    }
    ['top','bottom','left','right'].forEach(side=>{
      (r.wingResults[side]||[]).forEach(p=> rectAbs(p, paletteColor(p.name, SOFTWOOD_ORDER)));
    });
    if(r.segments && r.segments.length){
      if(r.mainCant) dashedOutline(0, r.mainCant.c, r.mainCant.W, r.mainCant.H);
      r.segments.forEach(seg=>{
        drawZone(seg.cxIn, seg.cyIn, seg.width, r.mainCant.H, seg.packed.placements, SOFTWOOD_ORDER);
      });
    }
    if(r.noFitRect){
      dashedOutline(0, r.noFitRect.c, r.noFitRect.W, r.noFitRect.H);
      const [na,nb]=rollPt(0,r.noFitRect.c);
      const w=(swapWH?r.noFitRect.H:r.noFitRect.W)*scale, h=(swapWH?r.noFitRect.W:r.noFitRect.H)*scale;
      const x=cx+na*scale-w/2, y=cy-nb*scale-h/2;
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chalk');
      labelWithOutline(`max: ${fmt(r.noFitRect.W,1)}"x${fmt(r.noFitRect.H,1)}"`, x+w/2, y+h/2+6, 18);
    }
  } else {
    if(r.fits){
      drawZone(0, r.cantC, r.W, r.cantH, r.placements, HARDWOOD_ORDER);
    }
    if(r.southPocket){
      drawZone(r.southPocket.cxIn, r.southPocket.cyIn, r.southPocket.W, r.southPocket.H, r.southPocket.placements, HARDWOOD_ORDER);
    }
    if(r.noFitRect){
      dashedOutline(0, r.noFitRect.c, r.noFitRect.W, r.noFitRect.H);
      const [na,nb]=rollPt(0,r.noFitRect.c);
      const w=(swapWH?r.noFitRect.H:r.noFitRect.W)*scale, h=(swapWH?r.noFitRect.W:r.noFitRect.H)*scale;
      const x=cx+na*scale-w/2, y=cy-nb*scale-h/2;
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chalk');
      labelWithOutline(`max: ${fmt(r.noFitRect.W,1)}"x${fmt(r.noFitRect.H,1)}"`, x+w/2, y+h/2+6, 18);
    }
    function customBoardLabel(b){
      const dims = state.settings.dims;
      const order = r.species==='hardwood' ? HARDWOOD_ORDER : SOFTWOOD_ORDER;
      for(const n of order){
        if(Math.abs(dims[n].h - b.t) < 0.01) return n;
      }
      return `${fmt(b.width,1)}x${fmt(b.t,2)}`;
    }
    (r.customBoards||[]).forEach(b=>{
      let wIn = b.side==='top' ? b.width : b.t;
      let hIn = b.side==='top' ? b.t : b.width;
      if(swapWH){ const t=wIn; wIn=hIn; hIn=t; }
      const [ra,rb]=rollPt(b.cxIn,b.cyIn);
      const w=wIn*scale, h=hIn*scale;
      const x=cx+ra*scale-w/2, y=cy-rb*scale-h/2;
      ctx.strokeStyle = '#6bb1b8'; ctx.lineWidth=2.5;
      ctx.strokeRect(x,y,w,h);
      const label = customBoardLabel(b);
      ctx.fillStyle = '#6bb1b8';
      if(w>=h){
        if(w>18 && h>18) labelWithOutline(label, x+w/2, y+h/2+4, 12);
      } else if(w>18 && h>28){
        ctx.save();
        ctx.translate(x+w/2, y+h/2);
        ctx.rotate(-Math.PI/2);
        labelWithOutline(label, 0, 6, 18);
        ctx.restore();
      }
    });
  }

  // circle key, top-left corner
  function keyLine(y, dash, width, col, txt){
    ctx.strokeStyle=col; ctx.lineWidth=width; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(14,y); ctx.lineTo(46,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=textDimCol; ctx.font='12px IBM Plex Mono'; ctx.textAlign='left';
    ctx.fillText(txt, 54, y+4);
  }
  keyLine(20, RING_STYLE.tight.dash, 2, RING_STYLE.tight.color, `tightest ${fmt(dia,1)}"`);
  keyLine(40, RING_STYLE.small.dash, 1.5, RING_STYLE.small.color, `small end ${fmt(r.dS,1)}"`);
  keyLine(60, RING_STYLE.large.dash, 1.5, RING_STYLE.large.color, `large end ${fmt(r.dL,1)}"`);

  // live slice ring — the log's true cross-section at the slider position (white in both views)
  const chalkCol = getComputedStyle(document.documentElement).getPropertyValue('--chalk');
  if(typeof millView.slice==='number'){
    const sx = r.L*Math.max(0, Math.min(1, millView.slice));
    const srr = taperDia(sx,r.L,r.dL,r.dS)/2;
    const [sa,sb] = rollPt(0, bowOffset(sx,r.L,r.bow));
    ctx.strokeStyle=chalkCol; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(cx+sa*scale, cy-sb*scale, srr*scale, 0, Math.PI*2); ctx.stroke();
    keyLine(80, [], 2.5, chalkCol, `slice ${fmt(srr*2,1)}"`);
  }

  // compass — the log's faces, so the letters roll with the log. Same N/E/S/W naming as the
  // wing/pocket tables and the mill-orientation view below. Screen-up = up on the mill.
  function compassAt(letter, a, b){
    const [ra,rb]=rollPt(a,b);
    labelWithOutline(letter, cx+ra*(RL+16), cy-rb*(RL+16)+5, 15);
  }
  ctx.fillStyle = DIR_N_COLOR; compassAt('N',0,1);
  ctx.fillStyle = DIR_E_COLOR; compassAt('E',1,0);
  ctx.fillStyle = textDimCol;  compassAt('S',0,-1); compassAt('W',-1,0);

  ctx.fillStyle = textDimCol;
  ctx.font='14px IBM Plex Mono'; ctx.textAlign='center';
  ctx.fillText(`viewed from the small end · boards packed at the tightest section (${fmt(dia,1)}" dia)`, cx, H-14);
}

// ---------- 3D mill-orientation viewer ----------
// Lightweight wireframe renderer — no libraries, keeps the app a single self-contained file.
// World frame matches the mill: x runs along the bed from the large end toward the small end
// (blade travel), y across the bed, z up. The board-layout view above is this same scene
// viewed from the small end, so its N (up) and E (screen right) are the amber and teal
// stripes here. Orbit angles persist across re-renders so the view doesn't snap back.
// Defaults to a (near) top-down plan view, large end at left — drag tilts/orbits from there.
// slice is the slicer position as a fraction of the log's length from the large end.
// rollQ is the log's roll in quarter turns (0-3), CCW viewed from the small end — shared by
// the board-layout view and the 3D view so both always show the same physical orientation.
const millView = { yaw:0, pitch:1.35, zoom:1, slice:0.5, rollQ:0 };

function drawMill3d(canvas, r){
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  BOW_PEAK_FRAC = (r.bowPeak ?? 50)/100;
  const {dL,dS,L,bow} = r;
  const maxR = Math.max(dL,dS)/2 || 1;
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v);

  // roll — same quarter-turn convention as the board-layout view (CCW viewed from small end)
  const rollQ = ((millView.rollQ||0)%4+4)%4;
  const rollA = rollQ*Math.PI/2;
  function rot2(a,b){
    if(rollQ===1) return [-b,a];
    if(rollQ===2) return [-a,-b];
    if(rollQ===3) return [b,-a];
    return [a,b];
  }

  const s3 = (W*0.82) / (L*1.15) * (millView.zoom||1);
  const cx=W/2, cyv=H*0.52;
  const cyaw=Math.cos(millView.yaw), syaw=Math.sin(millView.yaw);
  const cp=Math.cos(millView.pitch), sp=Math.sin(millView.pitch);
  // perspective projection: points foreshorten with distance from the camera. The returned
  // third element is camera-space depth, used to painter-sort the log body's faces.
  const camD = L*2.4;
  function P(x,y,z){
    const xw = x - L/2;
    const x1 = xw*cyaw - y*syaw;
    const y1 = xw*syaw + y*cyaw;
    const zv = y1*sp + z*cp;      // screen-vertical
    const d  = y1*cp - z*sp;      // depth, positive = away from camera
    const f  = camD/(camD + d);
    return [cx + x1*s3*f, cyv - zv*s3*f, d];
  }
  function line3(a,b){ ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
  function poly3(pts,close){ ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); if(close)ctx.closePath(); ctx.stroke(); }

  // mill bed — a grid just below the log's lowest surface
  let bedZ = Infinity;
  for(let i=0;i<=20;i++){ const x=L*i/20; bedZ = Math.min(bedZ, rot2(0,bowOffset(x,L,bow))[1] - taperDia(x,L,dL,dS)/2); }
  bedZ -= 0.6;
  ctx.strokeStyle = css('--line-dim'); ctx.lineWidth=1;
  const bedY = maxR*1.8, bedX0=-L*0.05, bedX1=L*1.05;
  for(let i=0;i<=4;i++){ const y=-bedY+2*bedY*i/4; line3(P(bedX0,y,bedZ), P(bedX1,y,bedZ)); }
  for(let i=0;i<=8;i++){ const x=bedX0+(bedX1-bedX0)*i/8; line3(P(x,-bedY,bedZ), P(x,bedY,bedZ)); }

  // solid translucent log body — longitudinal surface strips plus end caps, top-lit and
  // painter-sorted back-to-front so the far side shows through the near side and the cant
  // prism / slice plane read as being inside the wood.
  {
    const BSEG=28, BR=10;
    const ringPts=[];
    for(let i=0;i<=BR;i++){
      const x=L*i/BR, rr=taperDia(x,L,dL,dS)/2;
      const [yc,zc]=rot2(0, bowOffset(x,L,bow));
      const row=[];
      for(let k=0;k<BSEG;k++){
        const a=2*Math.PI*k/BSEG;
        row.push(P(x, yc+rr*Math.cos(a), zc+rr*Math.sin(a)));
      }
      ringPts.push(row);
    }
    const faces=[];
    for(let k=0;k<BSEG;k++){
      const k2=(k+1)%BSEG;
      const pts=[];
      for(let i=0;i<=BR;i++) pts.push(ringPts[i][k]);
      for(let i=BR;i>=0;i--) pts.push(ringPts[i][k2]);
      // top-lit: strips whose outward normal points up are brighter (angle is already in
      // mill frame — the surface of revolution is roll-invariant, only the stripes roll)
      const aMid=2*Math.PI*(k+0.5)/BSEG;
      const shade = 0.55 + 0.45*Math.max(0, Math.sin(aMid));
      const depth = pts.reduce((s,p)=>s+p[2],0)/pts.length;
      faces.push({pts, shade, depth});
    }
    [0,BR].forEach(i=>{
      const pts=ringPts[i].slice();
      faces.push({pts, shade:0.8, depth: pts.reduce((s,p)=>s+p[2],0)/pts.length});
    });
    faces.sort((a,b)=>b.depth-a.depth);
    faces.forEach(f=>{
      ctx.fillStyle=`rgba(${Math.round(217*f.shade)},${Math.round(145*f.shade)},${Math.round(80*f.shade)},0.30)`;
      ctx.beginPath();
      f.pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      ctx.closePath();
      ctx.fill();
    });
  }

  // log wireframe — rings along the length (taper + bow)
  const RINGS=8, SEG=28;
  function ringAt(x, color, width, dash){
    const rr=taperDia(x,L,dL,dS)/2;
    const [yc,zc]=rot2(0, bowOffset(x,L,bow));
    const pts=[];
    for(let k=0;k<SEG;k++){ const a=2*Math.PI*k/SEG; pts.push(P(x, yc+rr*Math.cos(a), zc+rr*Math.sin(a))); }
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash||[]);
    poly3(pts,true);
    ctx.setLineDash([]);
  }
  for(let i=1;i<RINGS;i++) ringAt(L*i/RINGS, css('--line'), 0.6, []);
  // orientation stripes along the log surface
  function seam(angle,color,width){
    const STEPS=RINGS*3, pts=[];
    const rolled = angle + rollA;
    for(let i=0;i<=STEPS;i++){
      const x=L*i/STEPS, rr=taperDia(x,L,dL,dS)/2;
      const [yc,zc]=rot2(0, bowOffset(x,L,bow));
      pts.push(P(x, yc+rr*Math.cos(rolled), zc+rr*Math.sin(rolled)));
    }
    ctx.strokeStyle=color; ctx.lineWidth=width; poly3(pts,false);
  }
  seam(-Math.PI/2, css('--line-dim'), 1);  // S
  seam(Math.PI, css('--line-dim'), 1);     // W
  seam(Math.PI/2, DIR_N_COLOR, 3);         // N — faces up for the opening cut
  seam(0, DIR_E_COLOR, 3);                 // E — screen-right in the layout view

  // the three reference sections, color/dash-matched to the board-layout view above
  ringAt(0, RING_STYLE.large.color, 2, RING_STYLE.large.dash);
  ringAt(L, RING_STYLE.small.color, 2, RING_STYLE.small.dash);
  const tightX = (r.envelope && typeof r.envelope.x==='number') ? r.envelope.x : L;
  ringAt(tightX, RING_STYLE.tight.color, 2.5, RING_STYLE.tight.dash);

  // the planned cant as a straight prism — straight sawing, so the log bows around it
  let cant=null;
  if(r.species==='softwood') cant = r.mainCant || (r.beamEnvelope ? {W:r.beamEnvelope.Wb, H:r.beamEnvelope.Hb, c:r.beamEnvelope.c} : null);
  else if(r.fits) cant = {W:r.W, H:r.cantH, c:r.cantC};
  if(!cant && r.noFitRect) cant = {W:r.noFitRect.W, H:r.noFitRect.H, c:r.noFitRect.c};
  if(cant && cant.W>0 && cant.H>0){
    const y0=-cant.W/2, y1=cant.W/2, z0=cant.c-cant.H/2, z1=cant.c+cant.H/2;
    ctx.strokeStyle = css('--chalk'); ctx.lineWidth=1.5; ctx.setLineDash([6,5]);
    function PC(x,a,b){ const [ry,rz]=rot2(a,b); return P(x,ry,rz); }
    const c000=PC(0,y0,z0),c001=PC(0,y0,z1),c010=PC(0,y1,z0),c011=PC(0,y1,z1);
    const c100=PC(L,y0,z0),c101=PC(L,y0,z1),c110=PC(L,y1,z0),c111=PC(L,y1,z1);
    [[c000,c001],[c001,c011],[c011,c010],[c010,c000],
     [c100,c101],[c101,c111],[c111,c110],[c110,c100],
     [c000,c100],[c001,c101],[c011,c111],[c010,c110]].forEach(pr=>line3(pr[0],pr[1]));
    ctx.setLineDash([]);
  }

  // slicer — a vertical cut plane at the slider position, with the true cross-section ring.
  // In the top-down default view the plane reads as a vertical handle across the log.
  if(typeof millView.slice==='number'){
    const sx = L*Math.max(0, Math.min(1, millView.slice));
    const srr = taperDia(sx,L,dL,dS)/2;
    const szc = rot2(0, bowOffset(sx,L,bow))[1];
    const zTop = szc+srr+1.2;
    const q = [P(sx,-bedY,bedZ), P(sx,bedY,bedZ), P(sx,bedY,zTop), P(sx,-bedY,zTop)];
    ctx.beginPath(); q.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
    ctx.fillStyle = 'rgba(238,248,251,0.07)'; ctx.fill();
    ctx.strokeStyle = css('--chalk'); ctx.lineWidth=1.5; ctx.stroke();
    ringAt(sx, css('--chalk'), 3, []);
  }

  // labels
  ctx.font='bold 12px IBM Plex Mono'; ctx.textAlign='center';
  ctx.fillStyle = css('--text-dim');
  const pLarge=P(0,0,bedZ), pSmall=P(L,0,bedZ);
  ctx.fillText('LARGE END', pLarge[0], pLarge[1]+18);
  ctx.fillText('SMALL END', pSmall[0], pSmall[1]+18);
  ctx.font='bold 16px IBM Plex Mono';
  const letterR = dS/2+1.5, nA = Math.PI/2+rollA, eA = rollA;
  ctx.fillStyle = DIR_N_COLOR;
  const nP=P(L*1.06, letterR*Math.cos(nA), letterR*Math.sin(nA)); ctx.fillText('N', nP[0], nP[1]);
  ctx.fillStyle = DIR_E_COLOR;
  const eP=P(L*1.06, letterR*Math.cos(eA), letterR*Math.sin(eA)); ctx.fillText('E', eP[0], eP[1]);

  // section key, top-left — same colors and dashes as the board-layout view
  const tightDia = r.envelope ? r.envelope.r*2 : dS;
  function key3(y, style, txt){
    ctx.strokeStyle=style.color; ctx.lineWidth=2; ctx.setLineDash(style.dash);
    ctx.beginPath(); ctx.moveTo(14,y); ctx.lineTo(46,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=css('--text-dim'); ctx.font='12px IBM Plex Mono'; ctx.textAlign='left';
    ctx.fillText(txt, 54, y+4);
  }
  key3(20, RING_STYLE.tight, `tightest ${fmt(tightDia,1)}"`);
  key3(40, RING_STYLE.small, `small end ${fmt(dS,1)}"`);
  key3(60, RING_STYLE.large, `large end ${fmt(dL,1)}"`);

  ctx.fillStyle = css('--text-dim'); ctx.font='12px IBM Plex Mono'; ctx.textAlign='center';
  ctx.fillText('drag to rotate · pinch or scroll to zoom · double-tap to reset', cx, H-10);
}

function clampZoom(z){ return Math.max(0.5, Math.min(8, z)); }

function attachMillDrag(canvas, r){
  const pointers = new Map();
  let lastPinchDist = 0;
  canvas.onpointerdown = e=>{
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    canvas.setPointerCapture(e.pointerId);
    if(pointers.size===2){
      const [a,b]=[...pointers.values()];
      lastPinchDist = Math.hypot(a.x-b.x, a.y-b.y);
    }
  };
  canvas.onpointermove = e=>{
    const p = pointers.get(e.pointerId);
    if(!p) return;
    if(pointers.size===1){
      millView.yaw += (e.clientX-p.x)*0.01;
      millView.pitch = Math.max(-1.35, Math.min(1.35, millView.pitch + (e.clientY-p.y)*0.008));
    }
    p.x=e.clientX; p.y=e.clientY;
    if(pointers.size===2){
      const [a,b]=[...pointers.values()];
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      if(lastPinchDist>0 && dist>0) millView.zoom = clampZoom(millView.zoom * dist/lastPinchDist);
      lastPinchDist = dist;
    }
    drawMill3d(canvas, r);
  };
  const endPointer = e=>{ pointers.delete(e.pointerId); lastPinchDist = 0; };
  canvas.onpointerup = endPointer;
  canvas.onpointercancel = endPointer;
  canvas.onwheel = e=>{
    e.preventDefault();
    millView.zoom = clampZoom(millView.zoom * Math.exp(-e.deltaY*0.0012));
    drawMill3d(canvas, r);
  };
  canvas.ondblclick = ()=>{ millView.zoom = 1; drawMill3d(canvas, r); };
}

// Build the web app manifest at runtime (avoids needing a second manifest.json file)
const manifest = {
  name: 'Millplan Web',
  short_name: 'Millplan',
  start_url: './',
  display: 'standalone',
  background_color: '#101d27',
  theme_color: '#101d27'
};
document.getElementById('manifest-link').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/json'}));

// Register the service worker for offline caching. Safe to fail silently if unsupported.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

document.getElementById('eyebrow').textContent = `Sawmill planner — ${APP_VERSION}`;
loadSettings();
loadLog();
renderAll();
</script>
</body>
</html>
